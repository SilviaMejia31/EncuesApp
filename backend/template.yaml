AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Survey API - FastAPI on Lambda

Globals:
  Function:
    Runtime: python3.11
    Timeout: 30
    MemorySize: 256

Resources:
  SurveyApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.main.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: SurveyResponses
        - DynamoDBReadPolicy:
            TableName: SurveyCatalog
      Environment:
        Variables:
          CATALOG_TABLE: SurveyCatalog
          RESPONSES_TABLE: SurveyResponses
      Events:
        Api:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
